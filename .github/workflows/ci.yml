name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只校验语法与 CLI 契约，不做真实下载（网络测试不适合放进 CI）
      - name: 语法检查
        run: python -m py_compile fastdl.py selftest.py demo/compare_download.py tests/test_offline.py

      - name: CLI 契约
        run: |
          python fastdl.py --version
          python fastdl.py --help
          python selftest.py --help
          python demo/compare_download.py --help
          # 确认非 TTY 环境下 --help 也能正常输出中文
          python fastdl.py --help > help.txt
          python -c "print('help.txt bytes:', len(open('help.txt','rb').read()))"

      - name: 单元测试（离线，不触网）
        run: python tests/test_offline.py -v
